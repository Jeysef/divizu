  --di-pill-unbound-text: #4338ca;
}
:where(.di-viz[data-theme="dark"]) {
  --di-canvas-bg: #18191c;
  --di-surface: #26272b;
  --di-stroke-container: #ea580c;
  --di-stroke-adapter: #f59e0b;
  --di-stroke-service: #3b82f6;
  --di-stroke-port: #10b981;
  --di-fg: #f4f4f6;
  --di-muted: #9ca3af;
